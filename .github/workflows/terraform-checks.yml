name: Terraform Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TF_VERSION: "1.5.7"

jobs:
  format:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting
        run: terraform fmt -recursive -check -diff

  validate-dev:
    name: Validate Dev Stack
    runs-on: ubuntu-latest
    needs: format
    strategy:
      matrix:
        stack:
          - live/dev/bootstrap-backend
          - live/dev/webapp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init (no backend)
        run: terraform -chdir=${{ matrix.stack }} init -backend=false

      - name: Terraform validate
        run: terraform -chdir=${{ matrix.stack }} validate

  validate-prod:
    name: Validate Prod Stack
    runs-on: ubuntu-latest
    needs: format
    strategy:
      matrix:
        stack:
          - live/prod/bootstrap-backend
          - live/prod/webapp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init (no backend)
        run: terraform -chdir=${{ matrix.stack }} init -backend=false

      - name: Terraform validate
        run: terraform -chdir=${{ matrix.stack }} validate

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    needs: format
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Init TFLint
        run: tflint --init --config "$(pwd)/.tflint.hcl"

      - name: Lint modules
        run: |
          for dir in modules/*/; do
            echo "::group::Linting ${dir}"
            tflint --chdir="${dir}" --config "$(pwd)/.tflint.hcl"
            echo "::endgroup::"
          done

      - name: Lint live stacks
        run: |
          for dir in live/dev/webapp live/dev/bootstrap-backend live/prod/webapp live/prod/bootstrap-backend; do
            echo "::group::Linting ${dir}"
            tflint --chdir="${dir}" --config "$(pwd)/.tflint.hcl"
            echo "::endgroup::"
          done

  checkov:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    needs: format
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          config_file: .checkov.yml
          output_format: cli
          soft_fail: true
